# Runs both test suites and the site build on every branch and pull request, so a break
# is caught before it reaches main, where pages.yml deploys
name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - run: make test
      - run: make web
      - run: make web-test
